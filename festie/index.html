<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Festie</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Festie">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&amp;family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#0A0A0A}a:hover{color:#0A0A0A}
input::placeholder,textarea::placeholder{color:rgba(10,10,10,0.55);opacity:1}
.rp-strip{scrollbar-width:none}
.rp-strip::-webkit-scrollbar{display:none}
</style>
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:#0A0A0A}
#festie-stage{position:fixed;left:0;top:0;width:390px}
#festie-stage>div{width:390px!important}
#festie-stage>div>div{height:100%!important}
#festie-stage main{overflow-y:auto!important}
#festie-vh{position:fixed;left:0;top:0;width:1px;height:100vh;height:100lvh;visibility:hidden;pointer-events:none}
.app-mode .sb{height:max(44px, env(safe-area-inset-top))!important;box-sizing:border-box}
.app-mode .sb>*{visibility:hidden}
.app-mode nav[aria-label="메인 탭"]{padding-bottom:max(22px, env(safe-area-inset-bottom))!important}
[role="button"]:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #0A0A0A;outline-offset:-2px}
</style>
<script>
(function(){
  var app = navigator.standalone || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  if (app) document.documentElement.classList.add('app-mode');
  window.__festieFit = function(){
    var st=document.getElementById('festie-stage'); if(!st||!st.firstElementChild) return;
    var pr=document.getElementById('festie-vh');
    var w=window.innerWidth, z=w/390, h=Math.max(window.innerHeight, document.documentElement.clientHeight, pr?pr.offsetHeight:0);
    st.style.zoom=z; st.firstElementChild.style.height=(h/z)+'px';
    var scr=st.firstElementChild.firstElementChild;
    if(scr){ var bg=getComputedStyle(scr).backgroundColor; document.documentElement.style.background=bg; document.body.style.background=bg; }
  };
  window.addEventListener('resize',function(){window.__festieFit()});
  window.addEventListener('orientationchange',function(){setTimeout(window.__festieFit,200)});
})();
</script>
<script src="morphdom-umd.min.js"></script>
<script src="festie-runtime.js"></script>
</head>
<body>
<div id="festie-vh"></div>
<div id="festie-stage"></div>
<template id="app-template">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F3D9FF">
<sc-if value="{{is.prep}}" data-hint="{{ true }}">
<div id="screen-prep" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3D9FF; color: #0A0A0A; display: flex; flex-direction: column; font-family: 'Hanken Grotesk', 'Noto Sans KR', sans-serif; overflow: hidden">

  <div class="sb" style="height: 44px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
    <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; padding-top: 3px">9:41</span>
    <svg width="44" height="12" viewBox="0 0 44 12" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx="1" fill="#0A0A0A"></rect>
      <rect x="5" y="5" width="3" height="7" rx="1" fill="#0A0A0A"></rect>
      <rect x="10" y="2" width="3" height="10" rx="1" fill="#0A0A0A"></rect>
      <rect x="18.75" y="0.75" width="21.5" height="10.5" rx="3" fill="none" stroke="#0A0A0A" stroke-width="1.5"></rect>
      <rect x="21" y="3" width="15" height="6" rx="1.5" fill="#0A0A0A"></rect>
      <rect x="41.5" y="4" width="1.5" height="4" rx="0.75" fill="#0A0A0A"></rect>
    </svg>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; padding: 12px 28px 0; min-height: 0">
    <div style="display: flex; align-items: center; min-height: 44px; margin-bottom: 8px">
      <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.16em; color: rgba(10,10,10,0.72); padding-top: 2px">MY FESTIVALS</span>
    </div>

    <section style="padding: 0 0 24px">
      <h1 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 56px; letter-spacing: -0.02em; line-height: 0.9; padding-top: 6px">PREPARE</h1>
      <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 2px; font-family: 'Noto Sans KR', sans-serif">
        <span style="font-weight: 700; font-size: 16px; line-height: 1.4">{{prep.headline}}</span>
        <span style="font-size: 13px; line-height: 1.4; color: rgba(10,10,10,0.72)">{{prep.sub}}</span>
      </div>
    </section>

    <sc-if value="{{prep.added}}" data-hint="{{ false }}">
    <div style="display: flex; flex-direction: column; border-bottom: 1.5px solid #0A0A0A">
      <a role="button" tabindex="0" onClick="{{go.Dashboard}}" style="cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 16px 0; border-top: 1.5px solid #0A0A0A; text-decoration: none">
        <img src="images/poster_gmf.jpg" alt="" style="width: 60px; height: 80px; flex-shrink: 0; object-fit: cover; display: block; border: 1.5px solid #0A0A0A; box-sizing: border-box">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0">
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; line-height: 1.1; text-transform: uppercase; padding-top: 2px">Grand Mint Festival 2026</span>
          <span style="font-size: 13px; color: rgba(10,10,10,0.72)">Oct 17–18 · Olympic Park</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; align-self: stretch; justify-content: space-between">
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.08em; line-height: 1.1; padding-top: 2px; color: {{prep.firstColor}}">{{prep.firstDday}}</span>
          <span aria-hidden="true" style="display: flex; align-items: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex-shrink: 0"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></span>
        </div>
      </a>
    </div>

    <button type="button" onClick="{{go.DiscoverCarousel}}" style="margin-top: 20px; width: 100%; min-height: 64px; box-sizing: border-box; border: 0; background: transparent; color: #0A0A0A; display: flex; align-items: center; justify-content: center; gap: 14px; cursor: pointer; padding: 0 16px">
      <span aria-hidden="true" style="width: 34px; height: 34px; box-sizing: border-box; border: 1.5px solid #0A0A0A; border-radius: 50%; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"><path d="M12 4v16M4 12h16"></path></svg>
      </span>
      <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.14em; padding-top: 3px">ADD FESTIVAL</span>
    </button>
    </sc-if>
    <sc-if value="{{prep.empty}}" data-hint="{{ true }}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; border-top: 1.5px solid #0A0A0A; border-bottom: 1.5px solid #0A0A0A; padding: 32px 0">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1"></rect><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"></path></svg>
      <span style="font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 17px">첫 페스티벌을 기다리는 중</span>
      <span style="font-family: 'Noto Sans KR', sans-serif; font-size: 13px; line-height: 1.6; color: rgba(10,10,10,0.72)">탐색에서 마음에 드는 페스티벌을 고르면<br>여기서 준비를 시작할 수 있어요</span>
    </div>
    <div style="padding: 16px 0 20px; display: flex; flex-direction: column; gap: 6px">
      <a role="button" tabindex="0" onClick="{{go.DiscoverCarousel}}" style="cursor: pointer; min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #0A0A0A; color: #F3D9FF; text-decoration: none; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.14em"><span style="padding-top: 3px">FIND FESTIVALS</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></a>
      <button type="button" style="min-height: 48px; border: 0; background: transparent; color: #0A0A0A; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.14em"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span style="padding-top: 3px">직접 추가하기</span></button>
    </div>
    </sc-if>
  </main>

  <nav aria-label="메인 탭" style="background: #0A0A0A; padding: 8px 28px 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); flex-shrink: 0">
    <a role="button" tabindex="0" onClick="{{go.DiscoverCarousel}}" style="cursor: pointer; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">탐색</span>    </a>
    <a role="button" tabindex="0" onClick="{{go.Main}}" aria-current="page" style="cursor: pointer; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #F3D9FF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1"></rect><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; line-height: 1">준비</span>    </a>
    <a role="button" tabindex="0" onClick="{{go.RecordHome}}" style="cursor: pointer; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1"></rect><circle cx="9" cy="10" r="1.75"></circle><path d="M20.5 15.5l-5-5-9.5 9"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">기록</span>    </a>
    <a href="#" style="min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.75"></circle><path d="M4.5 20.5c1.3-3.6 4-5.5 7.5-5.5s6.2 1.9 7.5 5.5"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">MY</span>    </a>
  </nav>
</div>
</sc-if>
<sc-if value="{{is.discover}}" data-hint="{{ false }}">
<div id="screen-discover" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3D9FF; color: #0A0A0A; display: flex; flex-direction: column; font-family: 'Hanken Grotesk', 'Noto Sans KR', sans-serif; overflow: hidden">

  <div class="sb" style="height: 44px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
    <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; padding-top: 3px">9:41</span>
    <svg width="44" height="12" viewBox="0 0 44 12" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx="1" fill="#0A0A0A"></rect>
      <rect x="5" y="5" width="3" height="7" rx="1" fill="#0A0A0A"></rect>
      <rect x="10" y="2" width="3" height="10" rx="1" fill="#0A0A0A"></rect>
      <rect x="18.75" y="0.75" width="21.5" height="10.5" rx="3" fill="none" stroke="#0A0A0A" stroke-width="1.5"></rect>
      <rect x="21" y="3" width="15" height="6" rx="1.5" fill="#0A0A0A"></rect>
      <rect x="41.5" y="4" width="1.5" height="4" rx="0.75" fill="#0A0A0A"></rect>
    </svg>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; padding: 12px 0 0 28px; min-height: 0; overflow-y: auto">
    <div style="display: flex; align-items: center; min-height: 44px; margin-bottom: 8px">
      <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.16em; color: rgba(10,10,10,0.72); padding-top: 2px">FESTIE</span>
    </div>

    <section style="padding: 0 28px 8px 0">
      <h1 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 56px; letter-spacing: -0.02em; line-height: 0.9; padding-top: 6px">DISCOVER</h1>
      <div style="margin-top: 18px; display: flex; align-items: center; gap: 10px; height: 56px; box-sizing: border-box; border: 1.5px solid #0A0A0A; background: transparent; padding: 0 16px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
        <label for="festival-search-c" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">페스티벌 검색</label>
        <input id="festival-search-c" type="search" value="{{disc.query}}" onChange="{{disc.onQuery}}" placeholder="페스티벌, 도시, 장르 검색" style="flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0; font-family: 'Noto Sans KR', sans-serif; font-size: 16px; color: #0A0A0A; outline-offset: 2px">
      </div>
    </section>

    <sc-for list="{{disc.sections}}" as="sec" hint-placeholder-count="2">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 28px 28px 14px 0">
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <h2 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; line-height: 0.95; padding-top: 4px">{{sec.title}}</h2>
          <span style="font-family: 'Noto Sans KR', sans-serif; font-size: 13px; line-height: 1.4; color: rgba(10,10,10,0.72)">{{sec.sub}}</span>
        </div>
      </div>
      <ul aria-label="{{sec.title}}" style="list-style: none; margin: 0; padding: 0 28px 4px 0; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; flex-shrink: 0">
        <sc-for list="{{sec.rows}}" as="f" hint-placeholder-count="2">
          <li style="flex: 0 0 {{sec.cardW}}px; scroll-snap-align: start">
            <a role="button" tabindex="0" onClick="{{f.go}}" aria-label="{{f.name}}" style="cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; height: {{sec.posterH}}px; box-sizing: border-box; background-color: #0A0A0A; color: #F3D9FF; text-decoration: none; overflow: hidden">
              <img src="{{f.poster}}" alt="{{f.posterLabel}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
              <span style="position: relative; z-index: 1; align-self: flex-start; margin: 14px 0 0 14px; background: #F3D9FF; color: #0A0A0A; padding: 5px 8px 3px; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em">{{f.dday}}</span>
              <div style="position: relative; z-index: 1; padding: 48px 14px 16px; background: linear-gradient(to bottom, rgba(10,10,10,0) 0%, rgba(10,10,10,0.9) 55%); display: flex; flex-direction: column; gap: 8px">
                <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: {{sec.nameSize}}px; letter-spacing: -0.01em; line-height: 0.95; text-transform: uppercase; padding-top: 3px">{{f.name}}</span>
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
                  <span style="font-size: 12px; line-height: 1.4; color: rgba(243,217,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.meta}}</span>
                  <span aria-hidden="true" style="flex-shrink: 0; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></span>
                </div>
              </div>
            </a>
          </li>
        </sc-for>
      </ul>
    </sc-for>

    <sc-if value="{{disc.empty}}" data-hint="{{ false }}">
      <div style="padding: 32px 28px 32px 0; display: flex; flex-direction: column; gap: 4px; font-family: 'Noto Sans KR', sans-serif">
        <span style="font-weight: 700; font-size: 14px">검색 결과가 없어요</span>
        <span style="font-size: 13px; color: rgba(10,10,10,0.72)">다른 페스티벌 이름이나 도시, 장르로 찾아봐요</span>
      </div>
    </sc-if>
    <div style="height: 24px; flex-shrink: 0"></div>
  </main>

  <nav aria-label="메인 탭" style="background: #0A0A0A; padding: 8px 28px 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); flex-shrink: 0">
    <a role="button" tabindex="0" onClick="{{go.DiscoverCarousel}}" aria-current="page" style="cursor: pointer; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #F3D9FF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; line-height: 1">탐색</span>
    </a>
    <a role="button" tabindex="0" onClick="{{go.Main}}" style="cursor: pointer; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1"></rect><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">준비</span>
    </a>

  <div class="sb" style="height: 44px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
    <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; padding-top: 3px">9:41</span>
    <svg width="44" height="12" viewBox="0 0 44 12" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx="1" fill="#0A0A0A"></rect>
      <rect x="5" y="5" width="3" height="7" rx="1" fill="#0A0A0A"></rect>
      <rect x="10" y="2" width="3" height="10" rx="1" fill="#0A0A0A"></rect>
      <rect x="18.75" y="0.75" width="21.5" height="10.5" rx="3" fill="none" stroke="#0A0A0A" stroke-width="1.5"></rect>
      <rect x="21" y="3" width="15" height="6" rx="1.5" fill="#0A0A0A"></rect>
      <rect x="41.5" y="4" width="1.5" height="4" rx="0.75" fill="#0A0A0A"></rect>
    </svg>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; padding: 12px 28px 0; min-height: 0">
    <div style="display: flex; align-items: center; min-height: 44px">
      <a role="button" tabindex="0" onClick="{{go.Dashboard}}" style="cursor: pointer; display: flex; align-items: center; gap: 6px; min-height: 44px; text-decoration: none; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.12em; color: #0A0A0A"><span aria-hidden="true" style="display: flex; align-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex-shrink: 0"><path d="M20 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></span><span style="padding-top: 2px">GRAND MINT FESTIVAL</span></a>
    </div>

    <div style="display: flex; flex-direction: column; margin: 4px 0 16px">
      <h1 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.02em; line-height: 0.9; padding-top: 4px">PLAYLIST</h1>
      <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 2px; font-family: 'Noto Sans KR', sans-serif">
        <span style="font-weight: 700; font-size: 16px; line-height: 1.4">{{pl.headline}}</span>
        <span style="font-size: 13px; line-height: 1.4; color: rgba(10,10,10,0.72)">최근 공연 셋리스트를 바탕으로 자동 생성돼요</span>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; border: 1.5px solid #0A0A0A; display: flex; flex-direction: column">
      <div style="background: #0A0A0A; color: #F3D9FF; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 16px 18px 14px; flex-shrink: 0">
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <span style="display: flex; align-items: center; gap: 8px; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.2em">
            <span style="padding-top: 2px">AUTO PLAYLIST</span>
          </span>
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.02em; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">GMF 2026</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0">
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.03em; line-height: 0.8; padding-top: 4px">{{pl.trackCount}}</span>
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.16em; line-height: 1">TRACKS</span>
        </div>
      </div>

      <div style="flex: 1; min-height: 0; overflow-y: auto">
        <sc-for list="{{pl.groups}}" as="g" hint-placeholder-count="3">
          <section style="border-top: {{g.divider}}; padding: 14px 16px 6px">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 8px">
              <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
                <span style="font-weight: 600; font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.artist}}</span>
                <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.12em; color: rgba(10,10,10,0.72)">{{g.when}}</span>
              </div>
              <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.14em; color: rgba(10,10,10,0.72); flex-shrink: 0">{{g.count}} TRACKS</span>
            </div>
            <ol style="list-style: none; margin: 0; padding: 0">
              <sc-for list="{{g.tracks}}" as="t" hint-placeholder-count="3">
                <li style="display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 38px; border-top: 1px solid rgba(10,10,10,0.15)">
                  <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 12px; color: rgba(10,10,10,0.72); padding-top: 2px">{{t.no}}</span>
                  <span style="font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
                  <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.12em; color: rgba(10,10,10,0.72); padding-top: 2px">{{t.tag}}</span>
                </li>
              </sc-for>
            </ol>
            <sc-if value="{{g.hasMore}}" data-hint="{{ true }}">
              <button type="button" aria-expanded="{{g.expandedAttr}}" onClick="{{g.toggle}}" style="width: 100%; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-top: 1px solid rgba(10,10,10,0.15); background: transparent; color: #0A0A0A; cursor: pointer; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.16em">
                <span style="padding-top: 2px">{{g.moreLabel}}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{g.chevron}}deg)"><path d="M6 9l6 6 6-6"></path></svg>
              </button>
            </sc-if>
          </section>
        </sc-for>
      </div>
    </div>

    <div style="padding: 12px 0 14px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <sc-if value="{{pl.exported}}" data-hint="{{ false }}">
        <div role="status" style="display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
          <span>{{pl.exportedTo}}(으)로 내보냈어요</span>
        </div>
      </sc-if>
      <button type="button" aria-haspopup="dialog" onClick="{{pl.openSheet}}" style="min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; background: #0A0A0A; color: #F3D9FF; cursor: pointer; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.14em">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F3D9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 14v6h16v-6"></path></svg>
        <span style="padding-top: 3px">EXPORT PLAYLIST</span>
      </button>
    </div>
  </main>

  <nav aria-label="메인 탭" style="background: #0A0A0A; padding: 8px 28px 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); flex-shrink: 0">
    <a role="button" tabindex="0" onClick="{{go.DiscoverCarousel}}" style="cursor: pointer; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">탐색</span>
    </a>
    <a role="button" tabindex="0" onClick="{{go.Main}}" aria-current="page" style="cursor: pointer; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #F3D9FF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1"></rect><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; line-height: 1">준비</span>
    </a>
    <a role="button" tabindex="0" onClick="{{go.RecordHome}}" style="cursor: pointer; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1"></rect><circle cx="9" cy="10" r="1.75"></circle><path d="M20.5 15.5l-5-5-9.5 9"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">기록</span>
    </a>
    <a href="#" style="min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.75"></circle><path d="M4.5 20.5c1.3-3.6 4-5.5 7.5-5.5s6.2 1.9 7.5 5.5"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">MY</span>
    </a>
  </nav>

  <sc-if value="{{pl.sheetOpen}}" data-hint="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end">
      <button type="button" aria-label="내보내기 닫기" onClick="{{pl.closeSheet}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(10,10,10,0.45); cursor: pointer"></button>
      <div role="dialog" aria-label="플레이리스트 내보내기" style="position: relative; background: #F3D9FF; border-top: 1.5px solid #0A0A0A; padding: 22px 28px 34px; display: flex; flex-direction: column">
        <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.2em; color: rgba(10,10,10,0.72)">EXPORT TO</span>
        <span style="margin-top: 6px; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 18px">어디로 내보낼까요?</span>
        <span style="margin-top: 2px; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: rgba(10,10,10,0.72)">{{pl.trackCount}}곡이 새 플레이리스트로 저장돼요</span>
        <div style="margin-top: 16px; display: flex; flex-direction: column; border-bottom: 1.5px solid #0A0A0A">
          <sc-for list="{{pl.targets}}" as="o" hint-placeholder-count="5">
            <button type="button" onClick="{{o.pick}}" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0; border: 0; border-top: 1.5px solid #0A0A0A; background: transparent; color: #0A0A0A; cursor: pointer; text-align: left">
              <span style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; padding-top: 3px">{{o.label}}</span>
                <span style="font-family: 'Noto Sans KR', sans-serif; font-size: 12px; color: rgba(10,10,10,0.72)">{{o.desc}}</span>
              </span>
              <span aria-hidden="true" style="display: flex; align-items: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex-shrink: 0"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></span>
            </button>
          </sc-for>
        </div>
        <button type="button" onClick="{{pl.closeSheet}}" style="margin-top: 12px; min-height: 44px; border: 0; background: transparent; color: rgba(10,10,10,0.72); cursor: pointer; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.18em"><span style="padding-top: 2px">CANCEL</span></button>
      </div>
    </div>
  </sc-if>
</div>
</sc-if>
<sc-if value="{{is.record}}" data-hint="{{ false }}">
<div id="screen-record" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFACD; color: #0A0A0A; display: flex; flex-direction: column; font-family: 'Hanken Grotesk', 'Noto Sans KR', sans-serif; overflow: hidden">

  <div class="sb" style="height: 44px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
    <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; padding-top: 3px">9:41</span>
    <svg width="44" height="12" viewBox="0 0 44 12" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx="1" fill="#0A0A0A"></rect>
      <rect x="5" y="5" width="3" height="7" rx="1" fill="#0A0A0A"></rect>
      <rect x="10" y="2" width="3" height="10" rx="1" fill="#0A0A0A"></rect>
      <rect x="18.75" y="0.75" width="21.5" height="10.5" rx="3" fill="none" stroke="#0A0A0A" stroke-width="1.5"></rect>
      <rect x="21" y="3" width="15" height="6" rx="1.5" fill="#0A0A0A"></rect>
      <rect x="41.5" y="4" width="1.5" height="4" rx="0.75" fill="#0A0A0A"></rect>
    </svg>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; padding: 12px 28px 0; min-height: 0; overflow-y: auto">
    <div style="display: flex; align-items: center; min-height: 44px; margin-bottom: 8px">
      <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.16em; color: rgba(10,10,10,0.72); padding-top: 2px">MY ARCHIVE</span>
    </div>

    <section style="padding: 0 0 8px">
      <h1 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 56px; letter-spacing: -0.02em; line-height: 0.9; padding-top: 6px">RECORD</h1>

      <div style="margin-top: 22px; border: 1.5px solid #0A0A0A; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
        <div style="padding: 16px 16px 14px; border-right: 1.5px solid #0A0A0A; border-bottom: 1.5px solid #0A0A0A; display: flex; flex-direction: column; gap: 10px">
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.22em; color: rgba(10,10,10,0.72)">FESTIVALS</span>
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.03em; line-height: 0.9; padding-top: 4px">{{rec.s1}}</span>
        </div>
        <div style="padding: 16px 16px 14px; border-bottom: 1.5px solid #0A0A0A; display: flex; flex-direction: column; gap: 10px">
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.22em; color: rgba(10,10,10,0.72)">ARTISTS</span>
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.03em; line-height: 0.9; padding-top: 4px">{{rec.s2}}</span>
        </div>
        <div style="padding: 16px 16px 14px; border-right: 1.5px solid #0A0A0A; display: flex; flex-direction: column; gap: 10px">
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.22em; color: rgba(10,10,10,0.72)">GENRES</span>
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.02em; line-height: 1.1; padding-top: 4px">{{rec.s3}}</span>
        </div>
        <div style="padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.22em; color: rgba(10,10,10,0.72)">CITIES</span>
          <span style="font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.03em; line-height: 0.9; padding-top: 4px">{{rec.s4}}</span>
        </div>
      </div>
    </section>

    <sc-if value="{{rec.showCard}}" data-hint="{{ true }}">
      <section aria-label="새 리포트 만들기" style="margin: 28px 4px 0 0; border: 1.5px solid #0A0A0A; background: #FFFACD; box-shadow: 4px 4px 0 #0A0A0A; flex-shrink: 0">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 0 0 16px; border-bottom: 1.5px solid #0A0A0A">
          <span style="display: flex; align-items: center; gap: 8px; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.22em; padding-top: 2px">
            <span style="background: #0A0A0A; color: #FFFACD; padding: 5px 8px 3px">JUST ENDED</span>
            <span style="color: rgba(10,10,10,0.72)">OCT 18 · 21:50</span>
          </span>
          <button type="button" aria-label="닫기" onClick="{{rec.dismiss}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-left: 1.5px solid #0A0A0A; background: transparent; cursor: pointer; color: #0A0A0A">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <div style="padding: 18px 16px 16px">
          <h2 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; line-height: 0.95; text-transform: uppercase; padding-top: 3px">Grand Mint Festival 2026</h2>
          <p style="margin: 10px 0 0; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; line-height: 1.6">수고했어요! 기억이 생생할 때<br>오늘 밤을 리포트로 남겨둘까요?</p>
          <div style="margin-top: 14px; display: flex; gap: 14px; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; color: rgba(10,10,10,0.72)">
            <span><span style="color: #0A0A0A; font-size: 13px; letter-spacing: 0">24</span> PHOTOS</span>
            <span><span style="color: #0A0A0A; font-size: 13px; letter-spacing: 0">{{rec.cardArtists}}</span> ARTISTS</span>
            <span><span style="color: #0A0A0A; font-size: 13px; letter-spacing: 0">{{rec.cardTracks}}</span> TRACKS</span>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); border-top: 1.5px solid #0A0A0A">
          <a role="button" tabindex="0" onClick="{{go.RecordEdit}}" style="cursor: pointer; min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #0A0A0A; color: #FFFACD; text-decoration: none; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.14em"><span style="padding-top: 3px">CREATE REPORT</span><span aria-hidden="true" style="display: flex; align-items: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex-shrink: 0"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></span></a>
          <button type="button" onClick="{{rec.dismiss}}" style="min-height: 52px; border: 0; background: transparent; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: rgba(10,10,10,0.72)">나중에</button>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{rec.hasRows}}" data-hint="{{ false }}">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 28px 0 14px">

    var SCREENS = ['prep', 'discover', 'detail', 'dash', 'tt', 'tte', 'check', 'playlist', 'record', 'reportEdit', 'report'];
    var is = {};
    SCREENS.forEach(function (s) { is[s] = st.screen === s; });

    return {
      is: is,
      go: {
        DiscoverCarousel: go('discover'),
        DiscoverDetail: go('detail'),
        Main: go('prep'),
        Dashboard: go('dash'),
        Timetable: go('tt'),
        TimetableEdit: go('tte'),
        Checklist: go('check'),
        Playlist: go('playlist'),
        RecordHome: go('record'),
        RecordHomeNew: go('record'),
        RecordEdit: go('reportEdit'),
        RecordDetailPhoto: go('report')
      },
      prep: prep, disc: disc, det: det, dash: dash, tt: tt, tte: tte, chk: chk, pl: pl, rec: rec, red: red, rep: rep
    };
  }
}
</script>
</body>
</html>
